name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install the source-test dependency
        run: |
          python3 -m pip install --only-binary=:all: -r requirements-tests.txt
      - name: Test source without retail data
        run: python3 -B -m unittest discover -s tests -v
      - name: Check public files
        run: python3 tools/check_public_release.py
      - name: Check patch whitespace
        run: git diff --check
